name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: read

jobs:
  build-macos-app:
    name: Build macOS App
    if: ${{ !contains(github.ref_name, 'windows') }}
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: app_version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing app version: ${VERSION} (tag: ${TAG})"

      - name: Stamp app version
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" macos/MoleApp/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" macos/MoleApp/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" macos/MoleApp/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" macos/MoleApp/Info.plist

      - name: Build release package
        run: |
          ./scripts/package-macos-app.sh
          test -s dist/Mole.app.zip
          test -s dist/Mole.app.zip.sha256
          unzip -t dist/Mole.app.zip

      - name: Verify bundled version
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          BUNDLED_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/macos/Mole.app/Contents/Info.plist)
          if [[ "${BUNDLED_VERSION}" != "${VERSION}" ]]; then
            echo "Expected bundle version ${VERSION}, got ${BUNDLED_VERSION}"
            exit 1
          fi

      - name: Generate release notes
        id: notes
        run: |
          CURRENT_TAG="${{ steps.app_version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^[vV][0-9]' | grep -vxF "${CURRENT_TAG}" | head -1 || true)

          if [[ -n "${PREV_TAG}" ]]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log -10 --pretty=format:"- %s" --no-merges)
          fi

          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "## Mole macOS App ${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "${COMMITS}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "---" >> "$GITHUB_OUTPUT"
          echo "Automated macOS app build by GitHub Actions" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        env:
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
        run: |
          TAG="${{ steps.app_version.outputs.tag }}"
          VERSION="${{ steps.app_version.outputs.version }}"
          mkdir -p dist/release
          cp dist/Mole.app.zip "dist/release/Mole-${VERSION}.zip"
          cp dist/Mole.app.zip "dist/release/Mole-${TAG}.zip"
          (
            cd dist/release
            shasum -a 256 "Mole-${VERSION}.zip" > "Mole-${VERSION}.zip.sha256"
            shasum -a 256 "Mole-${TAG}.zip" > "Mole-${TAG}.zip.sha256"
            shasum -a 256 "Mole-${VERSION}.zip" "Mole-${TAG}.zip" > SHA256SUMS
          )

          # Generate latest.json static manifest for GUI auto-update
          SHA256=$(cut -d' ' -f1 "dist/release/Mole-${VERSION}.zip.sha256")
          NOTES="$RELEASE_NOTES"
          cat > dist/release/latest.json <<MANIFEST_EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "asset": "Mole-${VERSION}.zip",
            "sha256": "${SHA256}",
            "notes": $(printf '%s' "$NOTES" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')
          }
          MANIFEST_EOF
          python3 -m json.tool dist/release/latest.json > dist/release/latest.json.tmp && mv dist/release/latest.json.tmp dist/release/latest.json
          ls -lh dist/release

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          name: Mole macOS App ${{ steps.app_version.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          files: dist/release/*
          draft: false
          prerelease: false

